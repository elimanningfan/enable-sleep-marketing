<div class="min-h-screen bg-gray-50 py-12 px-4 flex items-center justify-center">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-8 text-center">
    <h1 class="text-2xl font-bold text-gray-900 mb-3">Privacy Policy has moved</h1>
    <p class="text-gray-600 mb-4">
      Our Privacy Policy is now maintained at our documentation site. You are being redirected.
    </p>
    <p class="text-sm text-gray-500">
      If you are not redirected automatically,
      <a [href]="canonicalUrl" class="text-primary underline">click here to view the Privacy Policy</a>.
    </p>
  </div>
</div>
